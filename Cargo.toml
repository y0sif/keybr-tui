[package]
name = "keybr-tui"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Adaptive TUI typing trainer in Rust, bringing keybr.com's algorithm to your terminal. Offline touch-typing practice that imports your keybr.com data export."
repository = "https://github.com/y0sif/keybr-tui"
homepage = "https://y0sif.github.io/keybr-tui/"
keywords = ["typing", "typing-trainer", "tui", "terminal", "keybr"]
categories = ["command-line-utilities"]
readme = "README.md"
include = [
    "/src/**/*.rs",
    "/data/model-*.data",
    "/data/wordlist-*.txt",
    "/data/README.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[dependencies]
ratatui = "0.30.2"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
directories = "6"

# The local UTC offset comes from `localtime_r` on unix and from the Win32
# time API on Windows (see `local_utc_offset_secs` in
# persistence/localtime.rs). crossterm declares its own libc as optional
# and unix-gated, so it is not something crossterm hands us on Windows.
# Gate ours the same way rather than making every target depend on libc
# directly.
#
# taria-ratatui is unix-only for a harder reason: its transport is a unix
# domain socket (`std::os::unix::net`), so the crate does not compile for
# Windows at all. The whole taria integration is therefore `#[cfg(unix)]`
# in this crate, and the Windows build is taria-free.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
taria-ratatui = "0.4"

# Windows reads the offset via SystemTimeToTzSpecificLocalTime. windows-sys
# 0.61 is already in the Windows lock tree (dirs-sys, anstyle), so this adds
# features, not a new crate version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
